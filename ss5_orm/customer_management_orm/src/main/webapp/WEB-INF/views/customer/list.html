<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="common/layout :: head">
    <meta charset="UTF-8">
    <title>Page</title>
</head>
<style>
    .toolbar {
        display: flex;
        justify-content: space-between;
        text-decoration: none;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 0 16px;
        height: 36px;
        background-color: #4CAF50;
        text-decoration: none;
        color: white;
        border-radius: 4px;
        cursor: pointer;
    }

    .search-form {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .search-form input {
        height: 36px;
        width: 200px;
    }
</style>

<body>
    <h3>Customers</h3>

    <div class="toolbar">
        <a th:href="@{/customers/create}" class="btn">Add Customer</a>

        <form th:action="@{/customers}" method="get" class="search-form" style="display: flex; gap: 15px; align-items: center;">
            <!-- Search by Name -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="text" name="search" th:value="${keyword}" placeholder="  Search by name..."
                       style="height: 36px; width: 200px;" />
            </div>

            <!-- Search by Age Range -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <label style="font-weight: bold; white-space: nowrap;">Age:</label>
                <input type="text" name="minAge" th:value="${minAge}" placeholder="Min"
                       style="width: 80px; height: 36px; padding: 0 10px;" min="0" max="150" />
                <span>-</span>
                <input type="text" name="maxAge" th:value="${maxAge}" placeholder="Max"
                       style="width: 80px; height: 36px; padding: 0 10px;" min="0" max="150" />
            </div>

            <!-- Buttons -->
            <div style="display: flex; gap: 8px;">
                <button type="submit" class="btn">Search</button>
                <a th:href="@{/customers}" class="btn">Clear</a>
            </div>
        </form>

    </div>

    <!-- Kết quả tìm kiếm -->
    <div th:if="${(keyword != null and !keyword.isEmpty()) or (minAge != null and maxAge != null)}" style="margin: 10px 0; color: #666;">
    <span>Found <strong th:text="${customers.size()}">0</strong> customer(s)</span>
    </div>

    <div class="notify">
        <div th:if="${success}">
            <span th:text="${success}"></span>
        </div>
    </div>

    <table id="customers">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Address</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="customer : ${customers}">
                <td th:text="${customer.getId()}"></td>
                <td th:text="${customer.getName()}"></td>
                <td th:text="${customer.getAge()}"></td>
                <td th:text="${customer.getEmail()}"></td>
                <td th:text="${customer.getAddress()}"></td>
                <td>
                    <a th:href="@{/customers/{id}/edit(id=${customer.getId()})}" class="btn">Edit</a>
                    <button type="button" class="btn"
                        th:attr="data-id=${customer.getId()},
                                data-name=${customer.getName()},
                                data-email=${customer.getEmail()}"
                        th:onclick="openDeleteModal(this)">
                        Delete
                    </button>

                    <a th:href="@{/customers/{id}/view(id=${customer.getId()})}" class="btn">View</a>
                </td>
            </tr>
        </tbody>
    </table>
    <!-- Delete Confirmation Modal -->
    <div id="deleteModal"
        style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
        <div
            style="background-color: white; margin: 15% auto; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h3 style="margin-top: 0; background-color: #f44336; color: white; padding: 10px; border-radius: 4px;">
                Confirm Delete</h3>
            <p>Are you sure you want to delete this customer?</p>
            <div id="customerInfo"
                style="background-color: #f9f9f9; padding: 10px; margin: 15px 0; border-radius: 4px;">
                <p><strong>Name:</strong> <span id="customerName"></span></p>
                <p><strong>Email:</strong> <span id="customerEmail"></span></p>
            </div>

            <form id="deleteForm" th:action="@{/customers/delete}" method="post">
                <input type="hidden" id="customerId" name="id" />
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" onclick="closeDeleteModal()"
                        style="padding: 10px 20px; background-color: #ccc; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
                    <button type="submit"
                        style="padding: 10px 20px; background-color: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer;">Delete</button>
                </div>
            </form>
        </div>
    </div>
    <footer th:replace="common/layout :: footer"></footer>
    <script>
        function openDeleteModal(button) {
            const id = button.dataset.id;
            const name = button.dataset.name;
            const email = button.dataset.email;

            document.getElementById('customerId').value = id;
            document.getElementById('customerName').textContent = name;
            document.getElementById('customerEmail').textContent = email;
            document.getElementById('deleteModal').style.display = 'block';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('deleteModal');
            if (event.target === modal) {
                closeDeleteModal();
            }
        }
    </script>
</body>

</html>
