<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bài hát</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white py-3">
                <h1 class="h4 mb-0">
                    <i class="bi bi-book"></i> Quản lý thư viện
                </h1>
            </div>

            <div class="card-body">
                <h2 class="h5 text-success mb-3" th:text="${book.title}">Tên sách</h2>

                <p><strong>Tác giả:</strong>
                    <span th:text="${book.author}"></span>
                </p>

                <p><strong>Số lượng còn:</strong>
                    <span th:text="${book.quantity}"></span>
                </p>

                <div class="mt-4">
                    <form th:action="@{/books/{id}/borrow(id=${book.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-success btn-sm">
                            <i class="bi bi-box-arrow-in-down"></i> Mượn sách
                        </button>
                    </form>

                    <a th:href="@{/books}" class="btn btn-secondary btn-sm ms-2">
                        Quay lại
                    </a>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
