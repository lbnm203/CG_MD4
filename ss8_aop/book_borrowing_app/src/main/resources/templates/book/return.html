<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trả sách - Thư viện</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white py-3">
            <h1 class="h4 mb-0">
                <i class="bi bi-arrow-return-left"></i> Trả sách
            </h1>
        </div>

        <div class="card-body">
            <!-- Thông báo lỗi -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <strong th:text="${errorBorrowCode}">Lỗi!</strong>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Thông báo thành công -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Form trả sách -->
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <form th:action="@{/books/return}" method="post">
                        <div class="mb-3">
                            <label for="borrowCode" class="form-label">
                                <i class="bi bi-key-fill"></i> Mã mượn sách
                            </label>
                            <input type="text"
                                   class="form-control form-control-lg text-center"
                                   id="borrowCode"
                                   name="borrowCode"
                                   placeholder="Nhập mã 5 chữ số"
                                   maxlength="5"
                                   pattern="[0-9]{5}"
                                   required>
                            <div class="form-text">
                                Vui lòng nhập mã mượn sách gồm 5 chữ số mà bạn đã nhận khi mượn sách.
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-check-circle me-2"></i>Trả sách
                            </button>
                            <a th:href="@{/books}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-2"></i>Quay lại danh sách
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
