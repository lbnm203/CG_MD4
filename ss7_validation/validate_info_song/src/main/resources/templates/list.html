<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bài hát</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center py-3">
            <h1 class="h3 mb-0">
                <i class="bi bi-music-note-list"></i> Quản lý bài hát
            </h1>
        </div>

        <div class="card-body">
            <!-- Thông báo thành công -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Thông báo lỗi -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Nút thêm mới -->
            <div class="mb-4">
                <a href="/song/create" class="btn btn-primary btn-lg">
                    <i class="bi bi-plus-circle me-2"></i>Thêm bài hát mới
                </a>
            </div>

            <!-- Bảng danh sách -->
            <div th:if="${!listSong.isEmpty()}" class="table-responsive">
                <table class="table table-striped table-hover table-bordered align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col" class="text-center">ID</th>
                        <th scope="col">Tên bài hát</th>
                        <th scope="col">Nghệ sĩ</th>
                        <th scope="col">Thể loại</th>
                        <th scope="col" class="text-center">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="song : ${listSong}">
                        <td class="text-center fw-bold" th:text="${song.id}"></td>
                        <td th:text="${song.name}"></td>
                        <td th:text="${song.artist}"></td>
                        <td th:text="${song.category}"></td>
                        <td class="text-center">
                            <a th:href="@{/song/update/{id}(id=${song.id})}"
                               class="btn btn-success btn-sm">
                                <i class="bi bi-pencil-square me-1"></i>Sửa
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Trạng thái rỗng -->
            <div th:if="${listSong.isEmpty()}" class="text-center py-5">
                <i class="bi bi-inbox display-1 text-muted"></i>
                <h4 class="mt-3">Chưa có bài hát nào</h4>
                <p class="text-muted">Hãy thêm bài hát đầu tiên của bạn!</p>
                <a href="/song/create" class="btn btn-primary mt-3">
                    <i class="bi bi-plus-circle me-2"></i>Thêm ngay
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
