<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm bài hát mới</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h1 class="h3 mb-0">
                        <i class="bi bi-music-note-beamed"></i> Thêm bài hát mới
                    </h1>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/song/create}" th:object="${song}" method="post">
                        <!-- Tên bài hát -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">
                                Tên bài hát <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   id="name"
                                   th:field="*{name}"
                                   placeholder="Nhập tên bài hát">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            <div class="form-text">
                                <i class="bi bi-info-circle me-1"></i>
                                Tối đa 800 ký tự. Không chứa: @ ; , . = - +
                            </div>
                        </div>

                        <!-- Nghệ sĩ -->
                        <div class="mb-3">
                            <label for="artist" class="form-label fw-bold">
                                Nghệ sĩ <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('artist')} ? 'is-invalid' : ''"
                                   id="artist"
                                   th:field="*{artist}"
                                   placeholder="Nhập tên nghệ sĩ">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('artist')}" th:errors="*{artist}"></div>
                            <div class="form-text">
                                <i class="bi bi-info-circle me-1"></i>
                                Tối đa 300 ký tự. Không chứa: @ ; , . = - +
                            </div>
                        </div>

                        <!-- Thể loại -->
                        <div class="mb-4">
                            <label for="category" class="form-label fw-bold">
                                Thể loại <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''"
                                   id="category"
                                   th:field="*{category}"
                                   placeholder="Nhập thể loại">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                            <div class="form-text">
                                <i class="bi bi-info-circle me-1"></i>
                                Tối đa 1000 ký tự. Có thể dùng dấu phẩy (,). Không chứa: @ ; . = - +
                            </div>
                        </div>

                        <!-- Nút hành động -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-save me-2"></i>Lưu bài hát
                            </button>
                            <a href="/song" class="btn btn-secondary btn-lg">
                                <i class="bi bi-x-circle me-2"></i>Hủy
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
