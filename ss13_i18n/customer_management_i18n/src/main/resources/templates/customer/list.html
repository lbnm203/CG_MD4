<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{customer.list.title}">Customer List</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="#{customer.list.title}">Customer List</h1>

            <!-- Language Switcher -->
            <div class="btn-group" role="group">
                <a href="?lang=vi" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-translate"></i> Tiếng Việt
                </a>
                <a href="?lang=en" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-translate"></i> English
                </a>
            </div>
        </div>
        <div class="card shadow-lg">
            <div class="card-body">
                <a href="/customers/create" class="btn bold btn-success btn-lg">
                    <i class="bi"></i> <span th:text="#{customer.list.add}">Add New Customer</span>
                </a>

                <hr class="my-4">

                <!-- Thông báo thành công -->
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Thông báo lỗi -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${#lists.isEmpty(customers)}" class="col-12">
                    <div class="alert alert-info text-center">
                        <i class="bi bi-info-circle"></i> <span th:text="#{customer.list.empty}">Customer list is
                            empty!</span>
                    </div>
                </div>

                <!-- Bảng danh sách -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" th:text="#{customer.table.id}">ID</th>
                                <th scope="col" th:text="#{customer.table.firstName}">First Name</th>
                                <th scope="col" th:text="#{customer.table.lastName}">Last Name</th>
                                <th scope="col" class="text-center" th:text="#{customer.table.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="customer : ${customers}">
                                <td th:text="${customer.id}"></td>
                                <td th:text="${customer.firstName}"></td>
                                <td th:text="${customer.lastName}"></td>
                                <td class="text-center">
                                    <a th:href="@{/customers/{id}/update(id=${customer.id})}"
                                        class="btn btn-info btn-sm me-2">
                                        <i class="bi bi-eye me-1"></i><span th:text="#{button.update}">Update</span>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger flex-fill"
                                        data-bs-toggle="modal" data-bs-target="#deleteModal" th:attr="data-id=${customer.id},
                                                data-first-name=${customer.firstName},
                                                data-last-name=${customer.lastName}" onclick="prepareDelete(this)">
                                        <i class="bi bi-trash"></i> <span th:text="#{button.delete}">Delete</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteModalLabel">
                        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="#{modal.delete.title}">Delete
                            Confirmation</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2" th:text="#{modal.delete.question}">Do you want to delete this Customer?</p>
                    <div class="alert alert-warning mb-0">
                        <strong th:text="#{modal.delete.customerName}">Customer Name:</strong>
                        <span id="customerFullNameToDelete"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> <span th:text="#{button.cancel}">Cancel</span>
                    </button>
                    <form id="deleteForm" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> <span th:text="#{button.delete}">Delete</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function prepareDelete(button) {
            // Lấy thông tin từ button
            const customerId = button.getAttribute('data-id');
            const firstName = button.getAttribute('data-first-name');
            const lastName = button.getAttribute('data-last-name');

            // Hiển thị thông tin trong modal
            document.getElementById('customerFullNameToDelete').textContent = lastName + ' ' + firstName;

            // Set action cho form delete
            const deleteForm = document.getElementById('deleteForm');
            deleteForm.action = '/customers/' + customerId + '/delete';
        }
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
