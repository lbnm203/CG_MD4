<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bài hát</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white py-3">
                <h1 class="h3 mb-0">
                    <i class="bi bi-music-note-list"></i> Danh sách sản phẩm
                </h1>
            </div>

            <div class="card-body">
                <!-- Thông báo thành công -->
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Thông báo lỗi -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Nút thêm mới -->
                <div class="mb-4">
                    <a th:href="@{/cart}" class="btn btn-primary btn-lg">
                        <i class="bi bi-plus-circle me-2"></i>Giỏ hàng
                    </a>
                </div>

                <hr class="my-4">

                <!-- Bảng danh sách -->
                <div th:if="${!products.isEmpty()}" class="table-responsive">
                    <table class="table table-striped table-hover table-bordered align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" class="text-center">Thông tin</th>
                                <th scope="col">Mã sản phẩm</th>
                                <th scope="col">Giá</th>
                                <th scope="col" class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}">
                                <td class="text-center">
                                    <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}"
                                        alt="Product Image" class="img-thumbnail" style="max-width: 100px;">
                                    <span th:unless="${product.imageUrl != null}">No Image</span>
                                </td>
                                <td th:text="${product.name}"></td>
                                <td th:text="${product.price}"></td>
                                <td class="text-center">
                                    <a th:href="@{/product/detail/{id}(id=${product.id})}"
                                        class="btn btn-info btn-sm me-2">
                                        <i class="bi bi-eye me-1"></i>Xem chi tiết
                                    </a>
                                    <a th:href="@{/cart/add/{id}(id=${product.id},returnUrl='/product')}"
                                        class="btn btn-success btn-sm">
                                        <i class="bi bi-cart-plus me-1"></i>Thêm vào giỏ
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
