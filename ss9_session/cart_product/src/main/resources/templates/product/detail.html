<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - Chi tiết sản phẩm'">Chi tiết sản phẩm</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white py-3">
                <h1 class="h3 mb-0">
                    <i class="bi bi-box-seam"></i> Chi tiết sản phẩm
                </h1>
            </div>

            <div class="card-body">
                <!-- Nút quay lại -->
                <div class="mb-4">
                    <a th:href="@{/product}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Quay lại danh sách
                    </a>
                </div>

                <hr class="my-4">

                <!-- Thông tin sản phẩm -->
                <div class="row">
                    <!-- Hình ảnh sản phẩm -->
                    <div class="col-md-5 mb-4">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body text-center p-4">
                                <img th:if="${product.imageUrl != null && !product.imageUrl.isEmpty()}"
                                    th:src="${product.imageUrl}" th:alt="${product.name}" class="img-fluid rounded"
                                    style="max-height: 400px; object-fit: cover;">
                                <div th:unless="${product.imageUrl != null && !product.imageUrl.isEmpty()}"
                                    class="bg-light rounded d-flex align-items-center justify-content-center"
                                    style="height: 400px;">
                                    <div class="text-muted">
                                        <i class="bi bi-image" style="font-size: 80px;"></i>
                                        <p class="mt-3">Không có hình ảnh</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Chi tiết sản phẩm -->
                    <div class="col-md-7">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body p-4">
                                <!-- Mã sản phẩm -->
                                <div class="mb-3">
                                    <span class="badge bg-primary fs-6">
                                        <i class="bi bi-upc-scan me-1"></i>
                                        Mã: <span th:text="${product.code}">SP001</span>
                                    </span>
                                </div>

                                <!-- Tên sản phẩm -->
                                <h2 class="mb-4" th:text="${product.name}">Tên sản phẩm</h2>

                                <!-- Bảng thông tin -->
                                <table class="table table-bordered">
                                    <tbody>
                                        <tr>
                                            <th scope="row" class="bg-light" style="width: 40%;">
                                                <i class="bi bi-tag-fill text-primary me-2"></i>Giá bán
                                            </th>
                                            <td>
                                                <strong class="text-danger fs-5"
                                                    th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                                                    500.000 ₫
                                                </strong>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th scope="row" class="bg-light">
                                                <i class="bi bi-box-seam text-primary me-2"></i>Số lượng còn lại
                                            </th>
                                            <td>
                                                <span class="badge bg-info fs-6"
                                                    th:text="${product.quantity}">100</span>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th scope="row" class="bg-light">
                                                <i class="bi bi-check-circle-fill text-primary me-2"></i>Trạng thái
                                            </th>
                                            <td>
                                                <span th:if="${product.quantity > 0}" class="badge bg-success fs-6">
                                                    <i class="bi bi-check-circle me-1"></i>Còn hàng
                                                </span>
                                                <span th:unless="${product.quantity > 0}" class="badge bg-danger fs-6">
                                                    <i class="bi bi-x-circle me-1"></i>Hết hàng
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                                <!-- Mô tả sản phẩm -->
                                <div th:if="${product.description != null && !product.description.isEmpty()}"
                                    class="mt-4">
                                    <h5 class="mb-3">
                                        <i class="bi bi-file-text text-primary me-2"></i>Mô tả sản phẩm
                                    </h5>
                                    <div class="alert alert-light border">
                                        <p class="mb-0" th:text="${product.description}">
                                            Mô tả chi tiết về sản phẩm...
                                        </p>
                                    </div>
                                </div>

                                <!-- Nút hành động -->
                                <div class="mt-4 d-grid gap-2">
                                    <a th:href="@{/cart/add/{id}(id=${product.id},returnUrl='/product/detail/' + ${product.id})}"
                                        class="btn btn-success btn-lg"
                                        th:classappend="${product.quantity <= 0} ? 'disabled' : ''">
                                        <i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ hàng
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <!-- Thông tin bổ sung -->
                <div class="row">
                    <div class="col-12">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle-fill me-2"></i>
                            <strong>Lưu ý:</strong> Vui lòng kiểm tra kỹ thông tin sản phẩm trước khi thêm vào giỏ hàng.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
