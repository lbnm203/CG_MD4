<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán thành công</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card shadow-lg border-0" style="max-width: 800px; width: 100%;">

            <!-- Header -->
            <div class="card-header bg-success text-white text-center py-4 border-0">
                <div class="mb-3">
                    <div class="bg-white rounded-circle d-inline-flex align-items-center justify-content-center"
                        style="width: 80px; height: 80px;">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 45px;"></i>
                    </div>
                </div>
                <h1 class="h3 mb-0 fw-bold">Thanh toán thành công!</h1>
            </div>

            <!-- Body -->
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <h5 class="mb-3">
                        <i class="bi bi-bag-check me-2"></i>Chi tiết đơn hàng
                    </h5>
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th class="text-center" style="width: 5%;">ID</th>
                                    <th>Tên sản phẩm</th>
                                    <th class="text-center" style="width: 15%;">Đơn giá</th>
                                    <th class="text-center" style="width: 10%;">SL</th>
                                    <th class="text-end" style="width: 20%;">Thành tiền</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="entry, iterStat : ${cart.items}">
                                    <td class="text-center" th:text="${iterStat.count}">1</td>
                                    <td>
                                        <strong
                                            th:text="${products[entry.key] != null ? products[entry.key].name : 'N/A'}">
                                            Tên sản phẩm
                                        </strong>
                                        <br>
                                        <small class="text-muted">
                                            Mã: <span
                                                th:text="${products[entry.key] != null ? products[entry.key].code : 'N/A'}">SP001</span>
                                        </small>
                                    </td>
                                    <td class="text-center">
                                        <span
                                            th:text="${products[entry.key] != null ? #numbers.formatDecimal(products[entry.key].price, 0, 'COMMA', 0, 'POINT') + ' ₫' : 'N/A'}">
                                            350.000 ₫
                                        </span>
                                    </td>
                                    <td class="text-center">
                                        <span th:text="${entry.value}">2</span>
                                    </td>
                                    <td class="text-end">
                                        <strong
                                            th:text="${products[entry.key] != null ? #numbers.formatDecimal(products[entry.key].price * entry.value, 0, 'COMMA', 0, 'POINT') + ' ₫' : 'N/A'}">
                                            700.000 ₫
                                        </strong>
                                    </td>
                                </tr>
                            </tbody>
                            <tfoot class="table-light">
                                <tr>
                                    <td colspan="4" class="text-end fw-bold">Tổng cộng:</td>
                                    <td class="text-end">
                                        <strong class="text-danger fs-5"
                                            th:text="${totalAmount != null ? #numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT') + ' ₫' : '0 ₫'}">
                                            1.480.000 ₫
                                        </strong>
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="row g-3">
                    <div class="col-md-6">
                        <a th:href="@{/product}" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-house me-2"></i>Về trang chủ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
