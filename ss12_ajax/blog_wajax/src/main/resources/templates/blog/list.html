<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Blog</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/blogs">
                <i class="bi bi-journal-text"></i> Blog Technology
            </a>
            <div>
                <a href="/blogs" class="btn btn-light btn-sm">
                    <i class="bi bi-list-ul"></i> Blogs
                </a>
                <a href="/categories" class="btn btn-light btn-sm">
                    <i class="bi bi-tags"></i> Categories
                </a>
                <a href="/blogs/create" class="btn bold btn-success btn-sm">
                    <i class="bi bi-plus-circle"></i> New Blog
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary">
                <i class="bi bi-list-ul"></i> Blog List
            </h2>
            <div class="d-flex gap-3">
                <form id="searchForm" action="/blogs/search" method="get" class="flex-grow-1">
                    <div class="input-group d-flex gap-2">
                        <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                            placeholder="Search blog..." style="min-width: 250px; flex: 2;">

                        <select class="form-select" name="categoryId" style="max-width: 180px; flex: 1;"
                            th:value="${categoryId}">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                th:selected="${categoryId != null && cat.id == categoryId}">
                            </option>
                        </select>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-search"></i> Search
                        </button>
                        <a th:href="@{/blogs}" class="btn btn-primary clearfix">
                            <i class="bi bi-x-circle"></i> Clear
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Success Message -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Blog List -->
        <div id="blogListContainer" class="row">
            <div th:replace="~{blog/fragments/blog_list_fragment :: blogList}"></div>
        </div>
        <!-- <nav aria-label="Page navigation example">
            <ul class="pagination">
                <li class="page-item" th:if="${blogs.hasPrevious()}">
                    <a class="page-link" th:href="@{/blogs(page=${blogs.number - 1})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>

                <li class="page-item" th:if="${blogs.hasNext()}">
                    <a class="page-link" th:href="@{/blogs(page=${blogs.number + 1})}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>

                    </a>
                </li>
            </ul>
        </nav> -->
    </div>
    <div class="text-center my-4">
        <button id="loadMoreBtn" class="btn btn-primary btn-lg">
            <i class="bi bi-arrow-down-circle"></i> Tải thêm
        </button>
    </div>


    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteModalLabel">
                        <i class="bi bi-exclamation-triangle-fill"></i> Delete Confirmation
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2">Do you want to delete this Blog?</p>
                    <div class="alert alert-warning mb-0">
                        <strong>Title:</strong> <span id="blogTitleToDelete"></span><br>
                        <strong>Author:</strong> <span id="blogAuthorToDelete"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> Cancel
                    </button>
                    <form id="deleteForm" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function prepareDelete(button) {
            // Lấy thông tin từ button
            const blogId = button.getAttribute('data-id');
            const blogTitle = button.getAttribute('data-title');
            const blogAuthor = button.getAttribute('data-author');

            // Hiển thị thông tin trong modal
            document.getElementById('blogTitleToDelete').textContent = blogTitle;
            document.getElementById('blogAuthorToDelete').textContent = blogAuthor;

            // Set action cho form delete
            const deleteForm = document.getElementById('deleteForm');
            deleteForm.action = '/blogs/' + blogId + '/delete';
        }
    </script>
    <script th:src="@{/ajax.js}"></script>
</body>

</html>
