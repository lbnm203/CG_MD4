<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Bad Request</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-6 col-md-8">

            <!-- Error Card -->
            <div class="card shadow-lg border-0">
                <div class="card-body text-center p-5">

                    <!-- Error Icon -->
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
                    </div>

                    <!-- Error Code -->
                    <h1 class="display-1 fw-bold text-warning mb-3">400</h1>

                    <!-- Error Title -->
                    <h2 class="h3 mb-3">Yêu cầu không hợp lệ</h2>

                    <!-- Error Description -->
                    <p class="text-muted mb-4">
                        Xin lỗi, yêu cầu của bạn không thể được xử lý do dữ liệu không hợp lệ hoặc thiếu thông tin bắt buộc.
                    </p>

                    <!-- Action Buttons -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="/blogs" class="btn btn-primary">
                            <i class="bi bi-house-door"></i> Trang chủ
                        </a>
                    </div>

                </div>

                <!-- Card Footer -->
                <div class="card-footer bg-light text-center text-muted">
                    <small>
                        <i class="bi bi-info-circle"></i>
                        Nếu bạn cho rằng đây là lỗi hệ thống, vui lòng báo cáo cho chúng tôi
                    </small>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
