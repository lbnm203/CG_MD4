<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="bi bi-journal-text"></i> Blog Technology
        </a>
        <div>
            <a href="/blogs" class="btn btn-outline-light btn-sm me-2">
                <i class="bi bi-list-ul"></i> Blogs
            </a>
            <a href="/categories" class="btn btn-light btn-sm">
                <i class="bi bi-tags"></i> Categories
            </a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">
            <i class="bi bi-tags-fill"></i> Category List
        </h2>
        <a href="/categories/create" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> New Category
        </a>
    </div>

    <!-- Success Message -->
    <div th:if="${message}" class="alert alert-primary alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Category Table -->
    <div class="card shadow-sm">
        <div class="card-body">

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(categories)}" class="text-center py-5">
                <i class="bi bi-inbox text-muted" style="font-size: 4rem;"></i>
                <p class="text-muted mt-3">Category Empty!</p>
                <a href="/categories/create" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Create New Category
                </a>
            </div>

            <!-- Table -->
            <table th:if="${!#lists.isEmpty(categories)}" class="table table-hover">
                <thead class="table-primary">
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th style="width: 50%;">Category Name</th>
                    <th style="width: 20%;" class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}">1</td>
                    <td>
                        <strong th:text="${category.name}">Category Name</strong>
                    </td>
                    <td class="text-center">
                        <div class="btn-group btn-group-sm d-flex gap-2" role="group">
                            <a th:href="@{/categories/{id}/update(id=${category.id})}"
                               class="btn btn-outline-warning">
                                <i class="bi bi-pencil"> Edit</i>
                            </a>
                            <button type="button"
                                    class="btn btn-outline-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#deleteModal"
                                    th:data-category-id="${category.id}"
                                    th:data-category-name="${category.name}"
                                    onclick="prepareDelete(this)">
                                <i class="bi bi-trash"> Delete</i>
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Statistics -->
    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h3 class="text-success" th:text="${#lists.size(categories)}">0</h3>
                    <p class="text-muted mb-0">Category Total</p>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">
                    <i class="bi bi-exclamation-triangle-fill"></i> Delete Confirmation
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Do you want to delete this category?</p>
                <div class="alert alert-warning mb-0">
                    <strong>Category:</strong> <span id="categoryNameToDelete"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle"></i> Cancel
                </button>
                <form id="deleteForm" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function prepareDelete(button) {
        const categoryId = button.getAttribute('data-category-id');
        const categoryName = button.getAttribute('data-category-name');

        document.getElementById('categoryNameToDelete').textContent = categoryName;
        document.getElementById('deleteForm').action = '/categories/' + categoryId + '/delete';
    }
</script>
</body>
</html>
