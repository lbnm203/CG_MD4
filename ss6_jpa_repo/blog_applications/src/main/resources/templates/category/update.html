<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Danh mục</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="bi bi-journal-text"></i> Blog Technology
        </a>
        <div>
            <a href="/blogs" class="btn btn-outline-light btn-sm me-2">
                <i class="bi bi-list-ul"></i> Blogs
            </a>
            <a href="/categories" class="btn btn-light btn-sm">
                <i class="bi bi-tags"></i> Categories
            </a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <!-- Card Form -->
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square"></i> Category Update
                    </h4>
                </div>

                <div class="card-body p-4">
                    <!-- Form -->
                    <form th:action="@{/categories/update}" th:object="${category}" method="post">

                        <!-- Hidden ID -->
                        <input type="hidden" th:field="*{id}">

                        <!-- Tên danh mục -->
                        <div class="mb-4">
                            <label for="name" class="form-label fw-bold">
                                <i class="bi bi-tag-fill"></i> Category Name
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   id="name"
                                   th:field="*{name}"
                                   placeholder="Enter category name...">

                            <!-- Error message -->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                Category Name is required.
                            </div>
                        </div>

                        <!-- Info -->
                        <div class="alert alert-info">
                            <small class="text-muted">
                                <i class="bi bi-info-circle"></i> Category ID:
                                <strong th:text="${category.id}">1</strong>
                            </small>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2 justify-content-end">
                            <a href="/categories" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-check-circle"></i> Update
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
