<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Blog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/blogs">
            <i class="bi bi-journal-text"></i> Blog Technology
        </a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <a href="/blogs" class="btn btn-outline-secondary mb-3">
                <i class="bi bi-arrow-left"></i> Back Home
            </a>

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0" th:text="${blog.title}">Title</h2>
                </div>

                <div class="card-body p-4">
                    <p><strong>Author:</strong> <span th:text="${blog.author}">Author</span></p>
                    <p><strong>Category:</strong> <span class="badge bg-success" th:text="${blog.category != null ? blog.category.name : 'None'}">Category</span></p>
                    <p><strong>Create Date:</strong> <span th:text="${#temporals.format(blog.createdDate, 'dd/MM/yyyy HH:mm')}"></span></p>
                    <p><strong>Update Date:</strong> <span th:text="${#temporals.format(blog.updatedDate, 'dd/MM/yyyy HH:mm')}"></span></p>
                    <hr>

                    <h5>Content:</h5>
                    <p th:text="${blog.content}">Blog Content</p>
                </div>

                <div class="card-footer">
                    <a th:href="@{/blogs/{id}/update(id=${blog.id})}" class="btn btn-warning">Update</a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
